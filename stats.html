<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: "Mochiy Pop One", sans-serif;
      background-color: #000000;
      margin: 0;
      padding: 0;
      color: #ffffff;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      background-color: #000000;
      opacity: 0.8;
      backdrop-filter: blur(10px);
      z-index: -1;
    }

    .timebar {
      background-color: #434343;
      padding: 15px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item a {
      text-decoration: none;
      color: #ffffff;
      margin-left: 10px;
      padding: 10px;
      transition: 0.3s;
    }

    .item a:hover {
      background-color: #7a7a7a;
      border-radius: 5px;
      transition: 0.3s;
    }

    .title {
      font-size: 2rem;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin-top: 70px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .chart-container {
      background-color: #ffffff0e;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      border-left: 5px solid #0320fc;
    }

    .chart-title {
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 20px;
      text-align: center;
    }

    .chart-wrapper {
      position: relative;
      height: 400px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      color: #888;
      margin-top: 20px;
      font-size: x-large;
    }

    .stats-info {
      background-color: #ffffff0e;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      border-left: 5px solid #0320fc;
      text-align: center;
    }

    .stats-info p {
      margin: 5px 0;
      color: #cccccc;
    }

    .scale-toggle {
      background-color: #434343;
      border: 2px solid #ffffff;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-family: "Mochiy Pop One", sans-serif;
      font-size: 0.9rem;
      transition: 0.3s;
      margin: 10px 0;
    }

    .scale-toggle:hover {
      background-color: #7a7a7a;
      transition: 0.3s;
    }

    .scale-toggle.active {
      background-color: #0320fc;
      border-color: #0320fc;
    }

    @media (max-width: 768px) {
      .chart-wrapper {
        height: 300px;
      }

      .title {
        font-size: 1.5rem;
      }
    }
  </style>
  <title>Blog Statistics - Neneko's blog</title>
</head>

<body>
  <div class="timebar">
    <div class="item">
      <div class="name" style="font-size: 1.25rem; color: rgb(61, 255, 245)">
        Neneko Koromiko
      </div>
    </div>
    <div class="datetime" style="margin-right: 30px"></div>
  </div>

  <div class="title">Blog Statistics</div>

  <div class="container">
    <div class="item" style="justify-content: center; margin-bottom: 20px;">
      <a href="index.html">← Back to Blog</a>
    </div>

    <div class="loading" id="loading">Loading statistics...</div>

    <div id="stats-container" style="display: none;">
      <div class="stats-info">
        <p><strong>Total Page Views:</strong> <span id="total-views">0</span></p>
        <p><strong>Total Days Tracked:</strong> <span id="total-days">0</span></p>
        <p><strong>Average Daily Views:</strong> <span id="avg-daily">0</span></p>
        <p><strong>Highest Daily Views:</strong> <span id="max-daily">0</span></p>
        <button id="logScaleToggle" class="scale-toggle">Use Logarithmic Scale</button>
      </div>

      <div class="chart-container">
        <div class="chart-title">Daily Views (Last 30 Days)</div>
        <div class="chart-wrapper">
          <canvas id="dailyChart"></canvas>
        </div>
      </div>

      <div class="chart-container">
        <div class="chart-title">All-Time Cumulative Views</div>
        <div class="chart-wrapper">
          <canvas id="cumulativeChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      getDoc,
      doc,
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCcyR-VW3hFroVrG0164QwVO8WYSliGZQA",
      authDomain: "testrun-b565e.firebaseapp.com",
      databaseURL:
        "https://testrun-b565e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "testrun-b565e",
      storageBucket: "testrun-b565e.firebasestorage.app",
      messagingSenderId: "786542410028",
      appId: "1:786542410028:web:7898349ee8c158e96e9489",
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const countersRef = collection(db, "counters");

    let dailyChart = null;
    let cumulativeChart = null;
    let last30DaysData = null;
    let cumulativeData = null;
    let useLogScale = false;

    // Function to get UTC+7 date string
    function getUTC7DateString(date = new Date()) {
      const utc7Time = new Date(date.getTime() + (7 * 60 * 60 * 1000));
      const year = utc7Time.getUTCFullYear();
      const month = String(utc7Time.getUTCMonth() + 1).padStart(2, '0');
      const day = String(utc7Time.getUTCDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Function to format date for display
    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-');
      const date = new Date(year, month - 1, day);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function loadStatistics() {
      try {
        const loadingElem = document.getElementById('loading');
        const statsContainer = document.getElementById('stats-container');

        // Fetch all counter documents
        const countersSnapshot = await getDocs(countersRef);
        const allDocs = countersSnapshot.docs;

        // Get total views
        const totalViewsDoc = allDocs.find(doc => doc.id === 'blogViews');
        const totalViews = totalViewsDoc ? (totalViewsDoc.data().count || 0) : 0;

        // Get all daily visit documents
        const dailyVisits = [];
        allDocs.forEach(doc => {
          if (doc.id.startsWith('dailyVisits-')) {
            const dateKey = doc.id.replace('dailyVisits-', '');
            const data = doc.data();
            dailyVisits.push({
              date: dateKey,
              count: data.count || 0
            });
          }
        });

        // Sort by date
        dailyVisits.sort((a, b) => a.date.localeCompare(b.date));

        // Calculate statistics
        const totalDays = dailyVisits.length;
        const totalDailyViews = dailyVisits.reduce((sum, day) => sum + day.count, 0);
        const avgDaily = totalDays > 0 ? Math.round(totalDailyViews / totalDays) : 0;
        const maxDaily = dailyVisits.length > 0 ? Math.max(...dailyVisits.map(d => d.count)) : 0;

        // Update info display
        document.getElementById('total-views').textContent = totalViews.toLocaleString();
        document.getElementById('total-days').textContent = totalDays;
        document.getElementById('avg-daily').textContent = avgDaily.toLocaleString();
        document.getElementById('max-daily').textContent = maxDaily.toLocaleString();

        // Prepare data for last 30 days
        const today = new Date();
        const last30Days = [];
        for (let i = 29; i >= 0; i--) {
          const date = new Date(today);
          date.setDate(date.getDate() - i);
          const dateKey = getUTC7DateString(date);
          const dayData = dailyVisits.find(d => d.date === dateKey);
          last30Days.push({
            date: dateKey,
            count: dayData ? dayData.count : 0,
            displayDate: formatDate(dateKey)
          });
        }

        // Prepare cumulative data
        let cumulative = 0;
        const cumulativeDataArray = dailyVisits.map(day => {
          cumulative += day.count;
          return {
            date: day.date,
            count: day.count,
            cumulative: cumulative,
            displayDate: formatDate(day.date)
          };
        });

        // Store data globally for chart recreation
        last30DaysData = last30Days;
        cumulativeData = cumulativeDataArray;

        // Create charts
        createCharts();

        // Hide loading, show stats
        loadingElem.style.display = 'none';
        statsContainer.style.display = 'block';

      } catch (error) {
        console.error('Error loading statistics:', error);
        document.getElementById('loading').textContent = 'Error loading statistics. Please try again later.';
      }
    }

    function createCharts() {
      // Create daily chart (last 30 days)
      const dailyCtx = document.getElementById('dailyChart').getContext('2d');
      if (dailyChart) {
        dailyChart.destroy();
      }

      const dailyYScale = useLogScale ? {
        type: 'logarithmic',
        min: 0.1,
        ticks: {
          color: '#ffffff',
          callback: function(value) {
            return value >= 1 ? value.toLocaleString() : '';
          }
        },
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      } : {
        beginAtZero: true,
        ticks: {
          color: '#ffffff'
        },
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      };

      dailyChart = new Chart(dailyCtx, {
        type: 'line',
        data: {
          labels: last30DaysData.map(d => d.displayDate),
          datasets: [{
            label: 'Daily Views',
            data: last30DaysData.map(d => d.count),
            borderColor: 'rgb(61, 255, 245)',
            backgroundColor: 'rgba(61, 255, 245, 0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#ffffff'
              }
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.8)',
              titleColor: '#ffffff',
              bodyColor: '#ffffff',
              borderColor: 'rgb(61, 255, 245)',
              borderWidth: 1
            }
          },
          scales: {
            y: dailyYScale,
            x: {
              ticks: {
                color: '#ffffff',
                maxRotation: 45,
                minRotation: 45
              },
              grid: {
                color: 'rgba(255, 255, 255, 0.1)'
              }
            }
          }
        }
      });

      // Create cumulative chart
      const cumulativeCtx = document.getElementById('cumulativeChart').getContext('2d');
      if (cumulativeChart) {
        cumulativeChart.destroy();
      }

      const cumulativeYScale = useLogScale ? {
        type: 'logarithmic',
        min: 0.1,
        ticks: {
          color: '#ffffff',
          callback: function(value) {
            return value >= 1 ? value.toLocaleString() : '';
          }
        },
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      } : {
        beginAtZero: true,
        ticks: {
          color: '#ffffff'
        },
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      };

      cumulativeChart = new Chart(cumulativeCtx, {
        type: 'line',
        data: {
          labels: cumulativeData.map(d => d.displayDate),
          datasets: [{
            label: 'Cumulative Views',
            data: cumulativeData.map(d => d.cumulative),
            borderColor: '#0320fc',
            backgroundColor: 'rgba(3, 32, 252, 0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#ffffff'
              }
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.8)',
              titleColor: '#ffffff',
              bodyColor: '#ffffff',
              borderColor: '#0320fc',
              borderWidth: 1
            }
          },
          scales: {
            y: cumulativeYScale,
            x: {
              ticks: {
                color: '#ffffff',
                maxRotation: 45,
                minRotation: 45
              },
              grid: {
                color: 'rgba(255, 255, 255, 0.1)'
              }
            }
          }
        }
      });
    }

    function updateDateTime() {
      try {
        const now = new Date();
        const datetimeElem = document.querySelector(".datetime");
        if (datetimeElem) {
          datetimeElem.innerHTML = `${now.toLocaleDateString()} ${now.toLocaleTimeString(
            "en-GB",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: false,
            }
          )}`;
        }
      } catch (error) {
        console.error("Error updating datetime:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateDateTime();
      loadStatistics();
      setInterval(updateDateTime, 1000);

      // Add event listener for log scale toggle
      const logScaleToggle = document.getElementById('logScaleToggle');
      if (logScaleToggle) {
        logScaleToggle.addEventListener('click', () => {
          useLogScale = !useLogScale;
          logScaleToggle.textContent = useLogScale ? 'Use Linear Scale' : 'Use Logarithmic Scale';
          logScaleToggle.classList.toggle('active', useLogScale);
          
          // Recreate charts with new scale
          if (last30DaysData && cumulativeData) {
            createCharts();
          }
        });
      }
    });
  </script>
</body>

</html>
