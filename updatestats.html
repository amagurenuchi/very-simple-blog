<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      This is for updating status without having to manually edit the page
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/ced4c4a7f8.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <style>
    body {
      font-family: "Mochiy Pop One", sans-serif;
      background-color: #000000;
      margin: 0;
      padding: 0;
      color: #ffffff;
    }
    .title {
      font-size: 2rem;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .tohome {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 15px;
      border: #000000;
      border-bottom: 2px solid #ffffff;
      background-color: #000000;
      color: #ffffff;
      cursor: pointer;
      transition: 0.3s;
      font-family: "Mochiy Pop One", sans-serif;
    }

    .help-text {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 10px;
      text-align: center;
    }
    .container {
      max-width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #111111;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }
    .tgm4 {
      display: flex;
      flex-direction: column;
      border: 1px solid #ffffff;
      border-radius: 5px;
      padding: 10px;
    }
    .chunimai {
      display: flex;
      flex-direction: column;
      border: 1px solid #ffffff;
      border-radius: 5px;
      padding: 10px;
      margin-left: 20px;
    }
    input {
      width: 15vw;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ffffff;
      border-radius: 5px;
      background-color: #000000;
      color: #ffffff;
      box-sizing: border-box;
    }
    label {
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #cfa6b9;
    }
    .gamename {
      font-weight: bold;
      font-size: 0.8rem;
      color: #575757;
      position: relative;
    }

    #upload {
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 15px;
      border: #000000;
      border-bottom: 2px solid #ffffff;
      background-color: #000000;
      color: #ffffff;
      cursor: pointer;
      transition: 0.3s;
      font-family: "Mochiy Pop One", sans-serif;
      margin-top: 20px;
    }

    #upload:hover {
      background-color: #222222;
    }
  </style>
  <body>
    <button class="tohome">< Home</button>
    <div class="title">Do you need this? Yes you do.</div>
    <div class="help-text">
      This is just a simple way to update your stats without having to modify
      the webpage every time. <br />This uses Firebase because yay privacy
      invasion <br />More games will be included eventually...
    </div>
    <div class="container">
      <div class="tgm4">
        <span class="gamename">TGM4</span> <br />
        <label for="marathon">Marathon score:</label>
        <input type="text" name="marathon" id="marathon" />
        <label for="sprint">Sprint time:</label>
        <input type="text" name="sprint" id="sprint" />
        <label for="ultra">Ultra score:</label>
        <input type="text" name="ultra" id="ultra" />
        <br />
        <label for="normal">Normal grade:</label>
        <input type="text" name="normal" id="normal" />
        <input
          type="text"
          name="normaltime"
          id="normaltime"
          placeholder="(optional) time of completion"
        />
        <label for="normal11">Normal 1.1 grade:</label>
        <input type="text" name="normal11" id="normal11" />
        <input
          type="text"
          name="normal11time"
          id="normal11time"
          placeholder="(optional) time of completion"
        />
        <label for="normal21">Normal 2.1 grade:</label>
        <input type="text" name="normal21" id="normal21" />
        <input
          type="text"
          name="normal21time"
          id="normal21time"
          placeholder="(optional) time of completion"
        />
        <label for="normal31">Normal 3.1 grade:</label>
        <input type="text" name="normal31" id="normal31" />
        <input
          type="text"
          name="normal31time"
          id="normal31time"
          placeholder="(optional) time of completion"
        />
        <br />
        <label for="asuka">Asuka level:</label>
        <input type="text" name="asuka" id="asuka" />
        <input
          type="text"
          name="asukatime"
          id="asukatime"
          placeholder="time if completed"
        />
        <label for="asukaeasy">Asuka Easy Ae:</label>
        <input type="text" name="asukaeasy" id="asukaeasy" />
        <input
          type="text"
          name="asukaeasytime"
          id="asukaeasytime"
          placeholder="time if completed"
        />
        <label for="asukahard">Asuka Hard grade:</label>
        <input type="text" name="asukahard" id="asukahard" />
        <input
          type="text"
          name="asukahardtime"
          id="asukahardtime"
          placeholder="time if completed"
        />
        <br />
        <label for="master">Master level:</label>
        <input type="text" name="master" id="master" />
        <input type="text" name="mastergrade" id="mastergrade" />
        <input
          type="text"
          name="mastertime"
          id="mastertime"
          placeholder="time if completed"
        />
        <br />
        <label for="konoha">Konoha Easy Bravos:</label>
        <input type="text" name="konoha" id="konoha" />
        <label for="konohahard">Konoha Hard Bravos:</label>
        <input type="text" name="konohahard" id="konohahard" />
        <br />
        <label for="shiranui">Shiranui Tier:</label>
        <input type="text" name="shiranui" id="shiranui" />
      </div>
      <div class="chunimai">
        <span class="gamename">Chunithm & Maimai</span> <br />
        <label for="chunirating">Chunithm rating:</label>
        <input type="text" name="chunirating" id="chunirating" />
        <label for="chuniratingboard">Chunithm rating board image:</label>
        <input type="file" name="chuniratingboard" id="chuniratingboard" />
        <br />
        <span class="chuniboardlink"></span>
        <label for="maimairating">Maimai rating:</label>
        <input type="text" name="maimairating" id="maimairating" />
        <label for="maimairatingboard">Maimai rating board image:</label>
        <input type="file" name="maimairatingboard" id="maimairatingboard" />
        <span class="maimaiboardlink"></span>
      </div>
    </div>
    <input type="submit" value="Update Stats" id="upload" />
  </body>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      doc,
      deleteDoc,
      query,
      where,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZFoX2Y1Vvr2lObJyVTz-4ymeMdG4tpNU",
      authDomain: "milfish-4eda2.firebaseapp.com",
      projectId: "milfish-4eda2",
      storageBucket: "milfish-4eda2.appspot.com",
      messagingSenderId: "598214329916",
      appId: "1:598214329916:web:cde4617e0b0a3bbb89e539",
      measurementId: "G-M8B06PHB64",
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Initialize the elements
    const tohomeBtn = document.querySelector(".tohome");
    const uploadButton = document.getElementById("upload");
    const marathonInput = document.getElementById("marathon");
    const sprintInput = document.getElementById("sprint");
    const ultraInput = document.getElementById("ultra");
    const normalInput = document.getElementById("normal");
    const normal11Input = document.getElementById("normal11");
    const normal21Input = document.getElementById("normal21");
    const normal31Input = document.getElementById("normal31");
    const asukaInput = document.getElementById("asuka");
    const asukaeasyInput = document.getElementById("asukaeasy");
    const asukahardInput = document.getElementById("asukahard");
    const masterInput = document.getElementById("master");
    const konohaInput = document.getElementById("konoha");
    const konohahardInput = document.getElementById("konohahard");
    const shiranuiInput = document.getElementById("shiranui");
    const chuniratingInput = document.getElementById("chunirating");
    const maimairatingInput = document.getElementById("maimairating");
    const chuniratingboardInput = document.getElementById("chuniratingboard");
    const maimairatingboardInput = document.getElementById("maimairatingboard");
    const chuniboardlinkSpan = document.querySelector(".chuniboardlink");
    const maimaiboardlinkSpan = document.querySelector(".maimaiboardlink");

    tohomeBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // ImgBB API function
    async function uploadImageToImgBB(file) {
      const apiKey = "74c1612dc87c46d5879b1e76f59c40fa";
      const expirationTime = 60 * 60 * 24 * 7; // 7 days in seconds
      const formData = new FormData();
      formData.append("image", file);
      const response = await fetch(
        `https://api.imgbb.com/1/upload?key=${apiKey}&expiration=${expirationTime}`,
        {
          method: "POST",
          body: formData,
        }
      );

      const data = await response.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error("Image upload failed");
      }
    }
    chuniratingboardInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (file) {
        try {
          const imageUrl = await uploadImageToImgBB(file);
          chuniboardlinkSpan.innerHTML = `<a href="${imageUrl}" target="_blank">View uploaded Chunithm rating board image</a>`;
          console.log("Chunithm rating board image URL:", imageUrl);
        } catch (error) {
          console.error("Error uploading Chunithm rating board image:", error);
        }
      }
    });
    maimairatingboardInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (file) {
        try {
          const imageUrl = await uploadImageToImgBB(file);
          maimaiboardlinkSpan.innerHTML = `<a href="${imageUrl}" target="_blank">View uploaded Maimai rating board image</a>`;  
          console.log("Maimai rating board image URL:", imageUrl);
        } catch (error) {
          console.error("Error uploading Maimai rating board image:", error);
        }
      }
    });
    // Upload button event listener
    uploadButton.addEventListener("click", async () => {
        try {
            const collRef = collection(db, "gamestats");

            // Build queries for documents that identify each game
            const qTgm = query(collRef, where("type", "==", "tgm4"));
            const qChunimai = query(collRef, where("type", "==", "chunimai"));

            // Check existence
            const [snapTgm, snapChunimai] = await Promise.all([
                getDocs(qTgm),
                getDocs(qChunimai),
            ]);

            // If missing, create documents with a "type" field so we can find them later
            if (snapTgm.empty) {
                await addDoc(collRef, {
                    type: "tgm4",
                    marathon: "N/A",
                    sprint: "N/A",
                    ultra: "N/A",
                    normal: "N/A",
                    normal11: "N/A",
                    normal21: "N/A",
                    normal31: "N/A",
                    asuka: "N/A",
                    asukaeasy: "N/A",
                    asukahard: "N/A",
                    master: "N/A",
                    konoha: "N/A",
                    konohahard: "N/A",
                    shiranui: "N/A",
                });
            }
            if (snapChunimai.empty) {
                await addDoc(collRef, {
                    type: "chunimai",
                    chunirating: "N/A",
                    chuniratingboard: "No image uploaded",
                    maimairating: "N/A",
                    maimairatingboard: "No image uploaded",
                });
            }

            // Re-query to get the document references (could reuse previous snaps if not empty)
            const [snapTgm2, snapChunimai2] = await Promise.all([
                getDocs(qTgm),
                getDocs(qChunimai),
            ]);

            if (!snapTgm2.empty) {
                const tgmDocRef = snapTgm2.docs[0].ref;
                await updateDoc(tgmDocRef, {
                    marathon: marathonInput.value || "N/A",
                    sprint: sprintInput.value || "N/A",
                    ultra: ultraInput.value || "N/A",
                    normal: normalInput.value || "N/A",
                    normal11: normal11Input.value || "N/A",
                    normal21: normal21Input.value || "N/A",
                    normal31: normal31Input.value || "N/A",
                    asuka: asukaInput.value || "N/A",
                    asukaeasy: asukaeasyInput.value || "N/A",
                    asukahard: asukahardInput.value || "N/A",
                    master: masterInput.value || "N/A",
                    konoha: konohaInput.value || "N/A",
                    konohahard: konohahardInput.value || "N/A",
                    shiranui: shiranuiInput.value || "N/A",
                });
            }

            if (!snapChunimai2.empty) {
                const chDocRef = snapChunimai2.docs[0].ref;

                // If an uploaded image link exists in the UI, prefer that. Otherwise leave default text.
                const chunImgAnchor = chuniboardlinkSpan.querySelector("a");
                const maimaiImgAnchor = maimaiboardlinkSpan.querySelector("a");
                const chunImgUrl = chunImgAnchor ? chunImgAnchor.href : "No image uploaded";
                const maimaiImgUrl = maimaiImgAnchor
                    ? maimaiImgAnchor.href
                    : "No image uploaded";

                await updateDoc(chDocRef, {
                    chunirating: chuniratingInput.value || "N/A",
                    chuniratingboard: chunImgUrl,
                    maimairating: maimairatingInput.value || "N/A",
                    maimairatingboard: maimaiImgUrl,
                });
            }

            alert("Stats updated successfully!");
        } catch (error) {
            console.error("Error updating/creating stats:", error);
            alert("Failed to update stats. Please try again.");
        }
    });

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const querySnapshot = await getDocs(collection(db, "gamestats"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (doc.id === "tgm4") {
                    marathonInput.value = data.marathon || "";
                    sprintInput.value = data.sprint || "";
                    ultraInput.value = data.ultra || "";
                    normalInput.value = data.normal || "";
                    normal11Input.value = data.normal11 || "";
                    normal21Input.value = data.normal21 || "";
                    normal31Input.value = data.normal31 || "";
                    asukaInput.value = data.asuka || "";
                    asukaeasyInput.value = data.asukaeasy || "";
                    asukahardInput.value = data.asukahard || "";
                    masterInput.value = data.master || "";
                    konohaInput.value = data.konoha || "";
                    konohahardInput.value = data.konohahard || "";
                    shiranuiInput.value = data.shiranui || "";
                } else if (doc.id === "chunimai") {
                    chuniratingInput.value = data.chunirating || "";
                    maimairatingInput.value = data.maimairating || "";
                }
            });
        } catch (error) {
            console.error("Error loading stats: ", error);
        }
    });
  </script>
</html>
