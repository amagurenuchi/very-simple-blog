<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a blog</title>
    <style>
        body {
            font-family: "Mochiy Pop One", sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
        }
        .title {
            font-size: 2rem;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .form input {
            width: 50%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            background-color: #000000;
            color: #ffffff;
        }
        .form textarea {
            width: 60%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            background-color: #000000;
            color: #ffffff;
        }
        .form button {
            width: 10%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ffffff;
            border-radius: 5px;
        }
        .form button:hover {
            background-color: #7a7a7a;
            border-radius: 5px;
            transition: 0.3s;
            cursor: pointer;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="title">Write a blog</div>
    <div class="form">
        <input type="text" placeholder="Title">
        <textarea placeholder="Content"></textarea>
        <button type="submit" id="submit">Submit</button>
    </div>
</body>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
    const firebaseConfig = {
        apiKey: "AIzaSyCcyR-VW3hFroVrG0164QwVO8WYSliGZQA",
        authDomain: "testrun-b565e.firebaseapp.com",
        databaseURL: "https://testrun-b565e-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "testrun-b565e",
        storageBucket: "testrun-b565e.firebasestorage.app",
        messagingSenderId: "786542410028",
        appId: "1:786542410028:web:7898349ee8c158e96e9489"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const blogRef = collection(db, "blog");
    const form = document.querySelector(".form");
    const button = document.querySelector("#submit");

    button.addEventListener("click", async (e) => {
        e.preventDefault();
        const title = form.querySelector("input").value.trim();
        const content = form.querySelector("textarea").value.trim();

        if (!title || !content) {
            alert("Please fill in both the title and content.");
            return;
        }

        try {
            button.disabled = true;
            button.innerHTML = "Submitting...";
            await addDoc(blogRef, {
                title,
                content,
                createdAt: new Date()
            });
            button.disabled = false;
            button.innerHTML = "Submit";
            alert("Blog post submitted!");
            form.querySelector("input").value = "";
            form.querySelector("textarea").value = "";
        } catch (error) {
            console.error("Error adding document: ", error);
            alert("Failed to submit blog post. Please try again.");
        }
    });
</script>
</html>
